# aether kitty — same greyscale-with-one-signal-colour language as Dynamic
# Island: everything's a shade of near-black/off-white, and the only real
# colour in the whole palette is the same status green/red/amber the island
# uses for mic/camera/battery, reused here for ANSI green/red/yellow so a
# `git status`, a failing test, or a warning actually stands out instead of
# competing with a dozen neon ANSI colours for attention.

# ------------------------------------------------------------------- font
font_family      family="JetBrainsMono Nerd Font" postscript_name=JetBrainsMonoNL-Regular
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        14.0
font_features    JetBrainsMonoNL-Regular +zero +ss01
disable_ligatures never

# Tightened up slightly from kitty's default — the default line height on
# JetBrains Mono reads a little airy at this size.
adjust_line_height  108%
adjust_column_width 100%

# ---------------------------------------------------------------- cursor
cursor_shape          beam
cursor_beam_thickness 1.5
cursor_blink_interval 0.5
cursor_stop_blinking_after 15.0

# The one genuinely animated thing kitty does natively: a fading trail that
# follows fast cursor movement (jumping across a wide split, a long scrollback
# hop) instead of just teleporting. Off in denser, quieter moves so it never
# distracts during normal typing.
cursor_trail               2
cursor_trail_decay         0.1 0.4
cursor_trail_start_threshold 2

# ------------------------------------------------------------------ mouse
mouse_hide_wait 3.0
url_style       curly
detect_urls     yes

# ---------------------------------------------------------------- window
background_opacity 0.88
# Wayland-only, but that's what this rice runs on — real behind-glass blur
# instead of just a dimmer flat colour under the transparency.
background_blur    48

window_padding_width  10
placement_strategy    center
hide_window_decorations yes
confirm_os_window_close 0
remember_window_size  yes
resize_debounce_time  0.1

inactive_text_alpha 0.78
dim_opacity          0.75

# --------------------------------------------------------------- layout
enabled_layouts splits, stack
window_border_width 1
draw_minimal_borders yes
active_border_color   #f2f2f2
inactive_border_color #292929
bell_border_color     #d1a53c

# -------------------------------------------------------------- tab bar
tab_bar_edge            top
tab_bar_style            powerline
tab_powerline_style      slanted
tab_bar_min_tabs         2
tab_title_template        "{index}: {title}"
active_tab_font_style    bold
inactive_tab_font_style  normal
active_tab_foreground    #0b0c0f
active_tab_background    #f2f2f2
inactive_tab_foreground  #7d7d7d
inactive_tab_background  #15161a
tab_bar_background       #0b0c0f

# ---------------------------------------------------------------- bell
enable_audio_bell    no
visual_bell_duration  0.25
visual_bell_color     #d1a53c
window_alert_on_bell  yes

# ---------------------------------------------------------- scrollback
scrollback_lines     10000
wheel_scroll_min_lines 1
touch_scroll_multiplier 2.0

# -------------------------------------------------------------- terminal
shell_integration      enabled
allow_remote_control    yes
listen_on               unix:/tmp/kitty
update_check_interval   0
close_on_child_death    no

# --------------------------------------------------------------- colours
# Same triad as the Dynamic Island's status colours (themeStatusLive/
# Alert/Warn in DynamicIsland.qml) — deliberately the only saturated colour
# anywhere in this theme, so it reads as one system across the whole desktop
# rather than two unrelated colour choices that happen to share a terminal.
foreground            #f2f2f2
background            #0b0c0f
selection_foreground  #0b0c0f
selection_background  #f2f2f2

cursor                #f2f2f2
cursor_text_color     #0b0c0f

url_color #a8a8ad

# black
color0  #15161a
color8  #3f414a
# red — themeStatusAlert
color1  #c24a4e
color9  #d97377
# green — themeStatusLive
color2  #3aa863
color10 #5cc384
# yellow — themeStatusWarn
color3  #d1a53c
color11 #e0bd6c
# blue (kept desaturated/cool-grey rather than a "real" blue — nothing in
# this palette should read as a fourth signal colour alongside red/green/amber)
color4  #7d8590
color12 #9ba3ad
# magenta (same reasoning as blue)
color5  #8a7d90
color13 #a89bad
# cyan (same reasoning again)
color6  #6d9296
color14 #8fb4b8
# white
color7  #c6c8cd
color15 #fafafa
