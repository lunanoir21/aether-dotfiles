source = ~/.config/hypr/config/env.conf
# --------------------------------------------------------------------------------------
#
#   ██╗██╗  ██╗   ██╗ █████╗ ███╗   ███╗██╗██████╗  ██████╗
#   ██║██║  ╚██╗ ██╔╝██╔══██╗████╗ ████║██║██╔══██╗██╔═══██╗
#   ██║██║   ╚████╔╝ ███████║██╔████╔██║██║██████╔╝██║   ██║
#   ██║██║    ╚██╔╝  ██╔══██║██║╚██╔╝██║██║██╔══██╗██║   ██║
#   ██║███████╗██║   ██║  ██║██║ ╚═╝ ██║██║██║  ██║╚██████╔╝
#   ╚═╝╚══════╝╚═╝   ╚═╝  ╚═╝╚═╝     ╚═╝╚═╝╚═╝  ╚═╝ ╚═════╝
#
#   Created by ilyamiro
#   https://github.com/ilyamiro/nixos-configuration
#
# --------------------------------------------------------------------------------------

bind = SUPER, T, exec,
bind = CTRL SHIFT, S, exec, grimblast --notify copy area

# Tapping Super on its own opens/closes the Dynamic Island; SUPER+<key> combos
# are unaffected. Needs Main.qml to exist again (it hosts the island) before
# this actually does anything.
bind = SUPER, Super_L, exec, qs -p ~/.config/hypr/scripts/quickshell/Main.qml ipc call dynamicIsland toggle

# All-workspaces overview (hyprexpo plugin, bootstrapped/enabled via
# `hyprpm` — see bootstrap.sh). Deliberately not on bare SUPER: that key is
# already spoken for by the Dynamic Island toggle above.
bind = SUPER, TAB, hyprexpo:expo, toggle

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
#  ◈ PLUGINS
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

# Config keys match sandwichfarm/hyprexpo's own schema (see its README,
# docs/configuration/options.md) — it dropped enable_gesture/gesture_fingers
# (as booleans)/gesture_positive entirely from the original plugin this
# forked from, which is exactly what showed up as "Invalid value ... for
# finger count": Hyprland's core gesture parser picked those unrecognised
# keys up instead of the plugin ever seeing them. drag_drop_enable isn't a
# real key either (checked the full option reference) — drag/drop is just
# always available, styled via drag_drop_proxy_* below.
#
# Same colour language as kitty.conf and Dynamic Island's status colours:
# the current workspace's tile glows themeStatusLive green, keyboard-focus
# is themeStatusWarn amber, hover is plain white — nothing invents a new
# accent, it's the same three colours everywhere in this rice.
plugin {
    hyprexpo {
        columns = 3
        gaps_in = 14
        gaps_out = 28
        bg_col = rgba(0b0c0fee)
        workspace_method = center current
        gesture_distance = 300
        cancel_key = escape
        show_cursor = 1
        show_pinned_windows = 0

        # ---- tile shape
        tile_rounding = 16
        tile_rounding_power = 2.2
        tile_rounding_focus = 18
        tile_rounding_current = 18
        tile_rounding_hover = 18
        border_width = 2
        border_color = rgba(29292999)
        border_color_current = rgb(3aa863)
        border_color_focus = rgb(d1a53c)
        border_color_hover = rgb(f2f2f2)

        # ---- workspace labels (small numbered badge, bottom-left of each tile)
        label_enable = 1
        label_text_mode = id
        label_position = bottom-left
        label_offset_x = 10
        label_offset_y = 10
        label_show = always
        label_font_family = JetBrainsMono Nerd Font
        label_font_size = 15
        label_font_bold = 1
        label_color_default = rgb(7d7d7d)
        label_color_hover = rgb(f2f2f2)
        label_color_focus = rgb(d1a53c)
        label_color_current = rgb(3aa863)
        label_bg_enable = 1
        label_bg_color = rgba(0b0c0fcc)
        label_bg_shape = rounded
        label_bg_rounding = 8
        label_padding = 8

        # ---- keyboard navigation (arrow keys move the selection, Return confirms)
        keynav_enable = 1
        keynav_wrap_h = 1
        keynav_wrap_v = 1

        # ---- drag-and-drop styling (green, matching the current-tile border)
        drag_drop_proxy_color = rgba(3aa86333)
        drag_drop_proxy_active_color = rgba(3aa86366)
        drag_drop_proxy_border_color = rgb(3aa863)
        drag_drop_proxy_rounding = 14
    }
}

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
#  ◈ MONITORS
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

monitor=eDP-1,1920x1080@144,0x0,1


# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
#  ◈ ENVIRONMENT VARIABLES
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

env = NIXOS_OZONE_WL,1
# env = AQ_NO_ATOMIC,1  # kaldırıldı: legacy DRM page-flip donmasına sebep oluyordu

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
#  ◈ AUTOSTART
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

# Adds/enables/updates hyprexpo (SUPER+TAB workspace overview) each real
# session — has to run here, not in bootstrap.sh: hyprpm needs a live
# HYPRLAND_INSTANCE_SIGNATURE to detect the running Hyprland's version
# before it can add/build anything against it. Logs to
# ~/.cache/hyprexpo-setup.log — see the script itself for why this isn't
# a one-liner (network-readiness race + stale-headers self-heal).
exec-once = ~/.config/hypr/scripts/setup_hyprexpo.sh

exec-once = awww-daemon
exec-once = hypridle
exec-once = quickshell -p ~/.config/hypr/scripts/quickshell/Main.qml
exec-once = ~/.config/hypr/scripts/init.sh
exec-once = playerctld
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store
exec-once = ~/.config/hypr/scripts/volume_listener.sh
exec-once = systemctl --user enable --now easyeffects


# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
#  ◈ CORE VARIABLES
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

$mainMod = SUPER
$terminal = kitty

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
#  ◈ SETTINGS
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

general {
    border_size = 0
    gaps_in = 4
    gaps_out = 4
    float_gaps = 6
    resize_on_border = true
    extend_border_grab_area = 30
}

decoration {
    rounding = 8
    rounding_power = 4.0
    active_opacity = 1.0
    inactive_opacity = 1.0
    blur {
        enabled = false
    }
    shadow {
        enabled = false
    }
}

input {
    kb_layout = tr
    kb_options = grp:alt_shift_toggle

    touchpad {
        natural_scroll = true
    }
}

cursor {
    no_warps = true
    no_hardware_cursors = true
}

misc {
    font_family = JetBrains Mono
    disable_hyprland_logo = true
    disable_splash_rendering = true
    force_default_wallpaper = 0
}

ecosystem {
    no_update_news = true
    no_donation_nag = true
}

animations {
    enabled = yes
    bezier = myBezier, 0.05, 0.9, 0.1, 1.05
    animation = windows, 1, 5, myBezier, popin 80%
    animation = windowsOut, 1, 5, myBezier, popin 80%
    animation = layers, 1, 5, myBezier, fade
    animation = layersIn, 1, 5, myBezier, fade
    animation = layersOut, 1, 5, myBezier, fade
    animation = fade, 1, 5, myBezier
    animation = workspaces, 1, 5, myBezier, slide
    animation = specialWorkspaceIn, 1, 5, myBezier, fade
    animation = specialWorkspaceOut, 1, 5, myBezier, fade
}


# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
#  ◈ WINDOW & LAYER RULES
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

layerrule {
    name = "lr1"
    match:namespace = ^(volume_osd)$
    no_anim = on
}

layerrule {
    name = "lr2"
    match:namespace = ^(brightness_osd)$
    no_anim = on
}

layerrule {
    name = "lr3"
    match:namespace = hyprpicker
    no_anim = on
}

layerrule {
    name = "lr4"
    match:namespace = qsdock
    no_anim = on
}

layerrule {
    name = "lr5"
    match:namespace = ext-session-lock
    blur = on
    ignore_alpha = 0.2
}

windowrule {
    name = "app_launcher"
    match:title = ^(app-launcher)$
    float = on
    center = on
    size = 1200 600
    animation = slide
}

windowrule {
    name = "master_rule"
    match:title = ^(qs-master)$
    float = on
    no_shadow = on
    no_initial_focus = on
}


# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
#  ◈ KEYBINDINGS
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

# ───────── Mouse & Gestures ─────────
gesture = 3, horizontal, workspace
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# ───────── Window Management ─────────
bind = ALT, F4, exec, hyprctl dispatch killactive
bind = $mainMod, Q, exec, hyprctl dispatch killactive
bind = $mainMod&SHIFT_L, F, exec, bash -c 'if ! hyprctl activewindow | grep -q "title: qs-master"; then hyprctl dispatch togglefloating; fi'
binde = $mainMod&SHIFT_L, left, resizeactive,-50 0
binde = $mainMod&SHIFT_L, right, resizeactive,50 0
binde = $mainMod&SHIFT_L, up, resizeactive,0 -50
binde = $mainMod&SHIFT_L, down, resizeactive,0 50
bind = $mainMod&CTRL, left, movewindow, l
bind = $mainMod&CTRL, right, movewindow, r
bind = $mainMod&CTRL, up, movewindow, u
bind = $mainMod&CTRL, down, movewindow, d
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

# ───────── Applications & Launchers ─────────
bind = $mainMod, RETURN, exec, $terminal
bind = $mainMod, F, exec, firefox
bind = $mainMod, E, exec, nautilus
bind = ALT, TAB, exec, bash ~/.config/hypr/scripts/rofi_show.sh window
bind = $mainMod, A, exec, swaync-client -t -sw

# ───────── Screenshot ─────────
bind = $mainMod, S, exec, spotify
bind = $mainMod&SHIFT_L, S, exec, ~/.config/hypr/scripts/screenshot.sh --edit
bind = $mainMod, Z, exec, floorp
bind = , Print, exec, ~/.config/hypr/scripts/screenshot.sh --full
bind = SHIFT_L, Print, exec, ~/.config/hypr/scripts/screenshot.sh --full --edit

# ───────── System & Hardware ─────────
bindl = , Caps_Lock, exec, sleep 0.1 && swayosd-client --caps-lock
bindl = , XF86MonBrightnessDown, exec, swayosd-client --brightness lower
bindl = , XF86MonBrightnessUp, exec, swayosd-client --brightness raise

# ───────── Media & Audio ─────────
bindl = $mainMod, SPACE, exec, playerctl play-pause
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , xf86AudioMicMute, exec, swayosd-client --input-volume mute-toggle
bindl = , xf86audiomute, exec, swayosd-client --output-volume mute-toggle
bindel = , xf86audiolowervolume, exec, swayosd-client --output-volume lower
bindel = , xf86audioraisevolume, exec, swayosd-client --output-volume raise

# ───────── Workspaces ─────────
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# ───────── Move window under cursor to workspace (Super+Tab → 1-9) ─────────

# ───────── Move window under cursor to workspace (Super+Alt+1-9) ─────────


#SİGNAL BAŞLATMA
exec-once = gnome-keyring-daemon --start --components=secrets,pkcs11


#localsend

bind = SUPER, L, exec, localsend

# >>> jcode launch hotkeys (managed) >>>
# jcode: home
bind = SUPER, semicolon, exec, '/home/lunanoir/.jcode/hotkey/launch_jcode_0_cmd_semicolon.sh'
# jcode: last project
bind = SUPER, apostrophe, exec, '/home/lunanoir/.jcode/hotkey/launch_jcode_1_cmd_quote.sh'
# jcode: self-dev
bind = SUPER SHIFT, apostrophe, exec, '/home/lunanoir/.jcode/hotkey/launch_jcode_2_cmd_shift_quote.sh'
# <<< jcode launch hotkeys (managed) <<<
